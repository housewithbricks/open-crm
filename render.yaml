# Render Blueprint: https://render.com/docs/blueprint-spec
# One click: https://render.com/deploy?repo=https://github.com/housewithbricks/open-crm
services:
  - type: web
    name: open-crm
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: open-crm-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false # you're asked for it when you deploy
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: open-crm-db
    databaseName: opencrm
    user: opencrm
